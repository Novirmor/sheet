[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[project]
name = "sheet"
version = "0.1.0"
description = "A small SQLite-backed desktop spreadsheet"
requires-python = ">=3.14"
dependencies = [
  "pyside6>=6.10.0",
]

[project.scripts]
sheet = "sheet.app:main"

[dependency-groups]
dev = [
  "pyinstaller>=6.16.0",
  "pytest>=8.4.0",
  "ruff>=0.12.0",
  "ty>=0.0.1a20",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
