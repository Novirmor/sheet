name: Windows build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "packaging/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Taskfile.yml"
      - "mise.toml"
      - ".github/workflows/windows-build.yml"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: task setup

      - name: Run checks
        run: task check

      - name: Build Windows application
        run: task package

      - name: Smoke test executable
        shell: pwsh
        run: |
          & ".\dist\Sheet\Sheet.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & ".\dist\Sheet\Sheet.exe" --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $python = (Get-Command python -ErrorAction SilentlyContinue).Source
          if ($python) {
            & ".\dist\Sheet\Sheet.exe" --smoke-test --smoke-test-interpreter "$python"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Output "No external python found; skipped the external interpreter probe."
          }

      - name: Smoke test a packaged launch of an external environment
        shell: pwsh
        run: |
          uv venv .smoke-env
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --python ".smoke-env\Scripts\python.exe" pandas plotly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ".\dist\Sheet\Sheet.exe" --smoke-test --smoke-test-interpreter ".smoke-env\Scripts\python.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create distribution archive
        shell: pwsh
        run: Compress-Archive -Path "dist\Sheet\*" -DestinationPath "dist\Sheet-windows-x64.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: Sheet-windows-x64
          path: dist/Sheet-windows-x64.zip
          if-no-files-found: error
